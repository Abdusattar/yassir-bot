name: Deploy to GCP

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Syntax check
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.git/*" \
            | xargs python -m py_compile
          echo "Syntax OK"

      - name: Run tests
        run: python -m pytest tests/ -v

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop - обязательно. Без него шаг доходит до конца и
          # рапортует success, даже если git pull упал: 30.08.2026 три
          # коммита подряд "успешно задеплоились", а на сервере оставался
          # старый код (pull отказывался перезаписать неотслеживаемый
          # файл, который до этого положили на сервер руками).
          script_stop: true
          script: |
            set -e
            cd ~/yassir-bot && git pull origin master
            source ~/yassir-bot/venv/bin/activate && pip install -r requirements.txt -q
            # Статика приложения. index.html жил здесь один до 10.09.2026 -
            # теперь рядом манифест, service worker и иконки: без них значок
            # на экране телефона и работа без сети просто не заведутся, а
            # nginx отдаёт /var/www/yassir-app, а НЕ ~/yassir-bot/mushaf_data
            # (см. wiki/mushaf_yassirapp.md, "Где реально лежат отдаваемые
            # файлы"). page*.json сюда не копируются - они symlink'и.
            for f in index.html manifest.json sw.js \
                     icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
              cp ~/yassir-bot/mushaf_data/$f /var/www/yassir-app/$f
            done
            sudo systemctl restart yassir-bot
            # Женский бот - в том же деплое (23.09.2026). Раньше его
            # перезапускали руками, и однажды он неделю крутил код от 26.07:
            # файлы на диске общие (одна директория), а Python читает модули
            # только при старте. Пользовательский сервис, поэтому через
            # sudo -u stursunkul и его XDG_RUNTIME_DIR - системный systemctl
            # его не видит (см. wiki/infrastructure.md).
            sudo -u stursunkul XDG_RUNTIME_DIR=/run/user/$(id -u stursunkul) \
              systemctl --user restart yassir-bot-female.service
            # Проверка, что оба ДЕЙСТВИТЕЛЬНО поднялись. is-active мало:
            # сервис с Restart=always успевает отрапортовать active и упасть
            # снова. Спрашиваем сам процесс - его HTTP-порт открывается
            # только после успешного getMe и инициализации базы (bot.py).
            # Раньше женский невольно работал канарейкой (плохой коммит
            # ломал сперва одну половину); теперь вместо канарейки - эта
            # проверка: не ответили оба - деплой падает красным, а не молчит.
            sleep 12
            curl -fsS -m 5 localhost:8081/api/muf/version > /dev/null \
              || { echo "МУЖСКОЙ бот не отвечает после рестарта"; exit 1; }
            curl -fsS -m 5 localhost:8082/api/muf/version > /dev/null \
              || { echo "ЖЕНСКИЙ бот не отвечает после рестарта"; exit 1; }
            echo "Оба бота живы"
            # Печатаем реальный HEAD - в логе Actions сразу видно, что
            # выкатилось, без похода на сервер.
            git -C ~/yassir-bot log --oneline -1
            echo "Deploy done"
