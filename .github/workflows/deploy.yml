name: Deploy to GCP

on:
  push:
    branches: [master]
    # Пуш ТОЛЬКО с логами, вики и итогами сессий ботов не трогает (12.11.2026).
    # Логи - переписка команды (CLAUDE.md, «Логи видны обоим»): их шлём часто, в
    # начале и в конце каждой задачи, и перезапускать ради строки в логе оба бота
    # незачем. Код этих папок не читает. Если в пуше есть хоть один другой файл -
    # деплой идёт как обычно. На сервер эти файлы доедут со следующим деплоем кода.
    # Тот же список - в .githooks/pre-push (там он пропускает минуту тестов).
    paths-ignore:
      - "logs/**"
      - "wiki/**"
      - "context/**"
      - "CLAUDE.md"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Syntax check
        run: |
          find . -name "*.py" -not -path "./venv/*" -not -path "./.git/*" \
            | xargs python -m py_compile
          echo "Syntax OK"

      - name: Run tests
        run: python -m pytest tests/ -v

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # script_stop - обязательно. Без него шаг доходит до конца и
          # рапортует success, даже если git pull упал: 30.08.2026 три
          # коммита подряд "успешно задеплоились", а на сервере оставался
          # старый код (pull отказывался перезаписать неотслеживаемый
          # файл, который до этого положили на сервер руками).
          script_stop: true
          script: |
            set -e
            cd ~/yassir-bot && git pull origin master
            source ~/yassir-bot/venv/bin/activate && pip install -r requirements.txt -q
            # Статика приложения. index.html жил здесь один до 10.09.2026 -
            # теперь рядом манифест, service worker и иконки: без них значок
            # на экране телефона и работа без сети просто не заведутся, а
            # nginx отдаёт /var/www/yassir-app, а НЕ ~/yassir-bot/mushaf_data
            # (см. wiki/mushaf_yassirapp.md, "Где реально лежат отдаваемые
            # файлы"). page*.json сюда не копируются - они symlink'и.
            for f in index.html manifest.json sw.js \
                     icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png; do
              cp ~/yassir-bot/mushaf_data/$f /var/www/yassir-app/$f
            done
            # Листы раскладки Дар аль-Маариф (23.09.2026) - одной ссылкой на
            # папку, как audio/ и onboarding/.
            [ -e /var/www/yassir-app/dm ] || ln -s ~/yassir-bot/mushaf_data/dm /var/www/yassir-app/dm
            # Смысловой перевод по сурам (02.11.2026) - так же, ссылкой на папку.
            [ -e /var/www/yassir-app/meaning ] || ln -s ~/yassir-bot/mushaf_data/meaning /var/www/yassir-app/meaning
            # Пояснения к словам и страница «что изменилось» в пословном (12.11.2026).
            [ -e /var/www/yassir-app/notes ] || ln -s ~/yassir-bot/mushaf_data/notes /var/www/yassir-app/notes
            [ -e /var/www/yassir-app/wbw ] || ln -s ~/yassir-bot/mushaf_data/wbw /var/www/yassir-app/wbw
            # Пословные переводы по сурам из базы (14.11.2026, wiki/wbw_split_plan.md):
            # пересобираются на каждой выкатке - забыть нельзя. Не собралось - приложение
            # берёт прежние файлы или вшитый перевод, выкатку это не останавливает.
            python scripts/build_wbw_chunks.py || echo "::warning::wbw: файлы переводов не пересобраны"
            # Единый список отпечатков листов, смысла и переводов (14.11.2026, architecture.md Р1):
            # приложение берёт из него адреса файлов. Лежит ссылкой - пересборка между
            # выкатками (загрузка перевода) видна сразу.
            python scripts/build_data_manifest.py || echo "::warning::data_manifest.json не пересобран"
            [ -e /var/www/yassir-app/data_manifest.json ] || ln -s ~/yassir-bot/mushaf_data/data_manifest.json /var/www/yassir-app/data_manifest.json
            sudo systemctl restart yassir-bot
            # Женский бот - в том же деплое (23.09.2026). Раньше его
            # перезапускали руками, и однажды он неделю крутил код от 26.07:
            # файлы на диске общие (одна директория), а Python читает модули
            # только при старте. Пользовательский сервис, поэтому через
            # sudo -u stursunkul и его XDG_RUNTIME_DIR - системный systemctl
            # его не видит (см. wiki/infrastructure.md).
            # sudo тут НЕ нужен и не разрешён: деплой ходит на сервер
            # ровно этим пользователем, а его sudoers пускает только
            # `systemctl restart yassir-bot` (поймано первым же прогоном,
            # 23.09.2026). Из других учёток - через sudo -u stursunkul.
            if [ "$(id -un)" = "stursunkul" ]; then
              XDG_RUNTIME_DIR=/run/user/$(id -u) \
                systemctl --user restart yassir-bot-female.service
            else
              sudo -u stursunkul XDG_RUNTIME_DIR=/run/user/$(id -u stursunkul) \
                systemctl --user restart yassir-bot-female.service
            fi
            # Проверка, что оба ДЕЙСТВИТЕЛЬНО поднялись. is-active мало:
            # сервис с Restart=always успевает отрапортовать active и упасть
            # снова. Спрашиваем сам процесс - его HTTP-порт открывается
            # только после успешного getMe и инициализации базы (bot.py).
            # Раньше женский невольно работал канарейкой (плохой коммит
            # ломал сперва одну половину); теперь вместо канарейки - эта
            # проверка: не ответили оба - деплой падает красным, а не молчит.
            sleep 12
            curl -fsS -m 5 localhost:8081/api/muf/version > /dev/null \
              || { echo "МУЖСКОЙ бот не отвечает после рестарта"; exit 1; }
            curl -fsS -m 5 localhost:8082/api/muf/version > /dev/null \
              || { echo "ЖЕНСКИЙ бот не отвечает после рестарта"; exit 1; }
            echo "Оба бота живы"
            # Печатаем реальный HEAD - в логе Actions сразу видно, что
            # выкатилось, без похода на сервер.
            git -C ~/yassir-bot log --oneline -1
            echo "Deploy done"
