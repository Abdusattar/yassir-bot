<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="google" content="notranslate">
<title>Мусхаф — Яссир</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  @font-face {
    font-family: 'Scheherazade New';
    src: url('ScheherazadeNew-Regular.ttf') format('truetype');
    font-display: swap;
  }

  /* Настоящий шрифт QPC V4 Tajweed (King Fahd Complex) - цвета таджвида
     зашиты В САМ ШРИФТ через COLR/CPAL-таблицы, не через CSS-классы ниже
     (28.08.2026, см. scripts/export_mushaf_page.py: get_code_v4). Шрифт
     свой на КАЖДУЮ страницу (as static-cdn.tarteel.ai/.../p{N}.woff2) -
     src переписывается в JS на каждую загрузку страницы (см.
     #v4-font-face), сам @font-palette-values - фиксированная декларация,
     держит одно и то же имя семейства 'mushaf-v4' между страницами.
     Хотлинк на CDN QUL, не самохостинг - см. font_url_for_page. */
  @font-palette-values --V4Light { font-family: 'mushaf-v4'; base-palette: 0; }
  @font-palette-values --V4Dark { font-family: 'mushaf-v4'; base-palette: 1; }
  .v4-word {
    font-family: 'mushaf-v4', 'Scheherazade New', serif;
    font-palette: --V4Light;
  }
  @media (prefers-color-scheme: dark) {
    .v4-word { font-palette: --V4Dark; }
  }

  :root {
    --bg: #ffffff;
    --ink: #1a1a1a;
    --chrome-bg: #ffffff;
    --chrome-border: #ebeef0;
    --muted: #8a8370;
    --popup-bg: #2b2b2b;
    --popup-ink: #ffffff;
    --marker-color: #b08d2e;
    --dash-bg-start: #eaf4ec;
    --dash-bg-end: #f8f6ef;
    /* Акцент - приглушённый изумрудный (цвет обложки мусхафа), НЕ ярко-
       зелёный "успех" из обычных UI-китов - решение 29.08.2026, "высший
       класс дизайнера": один тон на всё приложение (кнопки, прогресс,
       бейдж иконки), не мешанина из синего/зелёного/жёлтого. */
    --accent: #1f7a52;
    --accent-ink: #ffffff;
    --accent-soft: #e3f2e8;
    --card-bg: #ffffff;
    --card-border: #e6e1d2;
    --shadow-sm: 0 1px 2px rgba(30, 25, 10, 0.05), 0 1px 6px rgba(30, 25, 10, 0.04);
    --shadow-md: 0 6px 20px rgba(30, 25, 10, 0.08), 0 2px 6px rgba(30, 25, 10, 0.05);
    --ok: #1f7a52;
    --ok-soft: #e3f2e8;
    --no: #b3403a;
    --no-soft: #fbe9e7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16140f;
      --ink: #f0ead8;
      --chrome-bg: #201d16;
      --chrome-border: #3a3527;
      --muted: #a39a7d;
      --popup-bg: #f0ead8;
      --popup-ink: #16140f;
      --marker-color: #d4af37;
      --dash-bg-start: #182019;
      --dash-bg-end: #14120d;
      --accent: #4cae83;
      --accent-ink: #0d1a12;
      --accent-soft: #1e3126;
      --card-bg: #201d16;
      --card-border: #3a3527;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.25), 0 1px 6px rgba(0, 0, 0, 0.2);
      --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.35), 0 2px 6px rgba(0, 0, 0, 0.25);
      --ok: #4cae83;
      --ok-soft: #1e3126;
      --no: #e0776f;
      --no-soft: #33201e;
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, .dash-card:focus-visible, .trainer-opt:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
  html, body {
    margin: 0; padding: 0;
    height: 100dvh; height: 100vh;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Scheherazade New', serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
  }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--chrome-border);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: var(--muted);
    direction: ltr;
    flex: 0 0 auto;
  }
  #topbar .topbar-left { display: flex; align-items: center; gap: 8px; }
  #topbar .topbar-right { display: flex; align-items: center; gap: 8px; }
  #btn-revision {
    background: none; border: none; font-size: 18px; padding: 2px 4px;
    cursor: pointer; line-height: 1;
  }
  #topbar .topbar-back {
    background: none; border: none; color: var(--accent);
    font-size: 13px; font-weight: 600; padding: 4px 0; cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #topbar .surah-name { font-weight: 600; color: var(--ink); }
  #topbar .nav-btn {
    background: none; border: none; color: var(--ink);
    font-size: 20px; padding: 4px 10px; cursor: pointer; line-height: 1;
  }
  #topbar .nav-btn:disabled { color: var(--chrome-border); }

  .view {
    display: none;
    flex: 1 1 auto;
    min-height: 0;
    flex-direction: column;
  }
  .view.active { display: flex; }

  #page-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 6px 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #ayah-text {
    direction: rtl;
    line-height: 2.0;
    width: 100%;
    /* Колонка чтения книжной ширины - без этого на широком экране (десктоп,
     * планшет, Telegram Desktop) justify растягивает 7-8 книжных слов на
     * всю ширину монитора с уродливыми огромными пробелами (поймано
     * пользователем 27.08.2026, смотрел с компьютера - подтвердил, что это
     * не артефакт моего теста). На настоящем узком телефоне (< 520px)
     * max-width вообще не срабатывает - там и так уже уже. */
    max-width: 520px;
    margin: 0 auto;
  }
  .mushaf-line {
    /* Каждая строка мусхафа - СВОЙ <div> (настоящая построчная вёрстка
     * QUL/King Fahd Complex, 27.08.2026). Flex + justify-content:
     * space-between, НЕ text-align: justify (28.08.2026, реальный баг -
     * левый край "гулял", разной длины на разных строках). Причина: у
     * V4-глифов (см. .v4-word) между словами нет обычного пробельного
     * символа - это отдельные PUA-глифы, конкатенированные впритык
     * (собственные интервалы уже зашиты в сам глиф) - тексту-выравниванию
     * банально нечего растягивать. Flex распределяет свободное
     * пространство между словами-элементами напрямую, не полагаясь на
     * пробелы в тексте - работает одинаково что для v4-слов, что для
     * отката на обычный юникод-текст (см. renderPage). */
    display: flex;
    flex-wrap: nowrap;
    justify-content: space-between;
    align-items: baseline;
  }
  .surah-banner {
    display: block;
    text-align: center;
    font-size: 0.7em;
    color: var(--marker-color);
    margin: 0.3em 0 0.5em;
    padding-bottom: 0.15em;
    border-bottom: 1px solid var(--chrome-border);
  }
  .bismillah {
    display: block;
    text-align: center;
    margin: 0 0 0.4em;
  }

  /* Цвета таджвида - официальная легенда alquran.cloud/tajweed-guide
     (27.08.2026). Классы idgham_wo_ghunnah/laam_shamsiyah/slnt - реальные
     имена, которые отдаёт api.quran.com (не совпадают буква в букву с
     легендой - "wo" вместо "no", "shamsiyah" вместо "shamsiyyah", "slnt"
     вместо "silent" - смысл и цвет те же, сверено вручную). */
  tajweed[class=ham_wasl],
  tajweed[class=slnt],
  tajweed[class=laam_shamsiyah],
  tajweed[class=idgham_mutajanisayn],
  tajweed[class=idgham_mutaqaribayn] { color: #AAAAAA; }
  tajweed[class=madda_normal] { color: #537FFF; }
  tajweed[class=madda_permissible] { color: #4050FF; }
  tajweed[class=madda_necessary] { color: #000EBC; }
  tajweed[class=qalaqah] { color: #DD0008; }
  tajweed[class=madda_obligatory] { color: #2144C1; }
  tajweed[class=ikhafa_shafawi] { color: #D500B7; }
  tajweed[class=ikhafa] { color: #9400A8; }
  tajweed[class=idgham_shafawi] { color: #58B800; }
  tajweed[class=iqlab] { color: #26BFFD; }
  tajweed[class=idgham_ghunnah] { color: #169777; }
  tajweed[class=idgham_wo_ghunnah] { color: #169200; }
  tajweed[class=ghunnah] { color: #FF7E1E; }
  .marker { color: var(--marker-color); padding: 0 2px; }
  .ayah-end {
    font-size: 0.55em;
    vertical-align: 0.15em;
    color: var(--marker-color);
    margin: 0 2px;
    display: inline-block;
  }

  #page-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: var(--chrome-bg);
    border-bottom: 1px solid var(--chrome-border);
    flex: 0 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  #page-nav button {
    background: none; border: none; color: var(--ink);
    font-size: 22px; padding: 8px 10px; cursor: pointer; line-height: 1;
  }
  #page-nav button:disabled { color: var(--chrome-border); }
  /* Закладка страницы чтения + переход к Аль-Бакаре (30.08.2026) -
     дополнительные кнопки в и так тесном #page-nav (узкие экраны телефонов,
     см. clampFontToFit) - меньше font-size, чем у основных ‹/›, чтобы 4
     новых элемента не столкнули номер страницы за край. Вертикальный
     padding - как у основных кнопок (не меньше), а не урезанный отдельно -
     иначе высота тап-зоны падала до ~24px (замерено headless Chrome,
     30.08.2026, по прямому вопросу пользователя про удобство тапа -
     оказалось нет, поправлено). Переполнения на 360px экране всё равно
     нет (перепроверено headless Chrome). */
  /* direction: ltr (30.08.2026) - #page-nav наследует dir="rtl" от <html>
     (нужен для арабского текста мусхафа). «/» - "зеркалящиеся" юникод-символы
     (Bidi_Mirrored=Yes) - в RTL-контексте физически перерисовываются в
     обратную форму (написано «, отрисовывается »). У ‹/› (соседние кнопки
     перелистывания) это случайно компенсируется их же собственной
     позиционной перестановкой RTL-flex - трогать их не нужно, там всё и так
     выглядит верно. Для НОВЫХ кнопок (30.08.2026, реальная путаница
     пользователя - "то, что выглядит как >>, ведёт к закладке") мирроринг
     не отменяется сам собой - явный direction: ltr останавливает
     перерисовку глифа, оставляя код и картинку в соответствии. */
  #page-nav button.page-nav-util {
    font-size: 16px; padding: 8px 9px; direction: ltr;
  }
  #page-indicator {
    font-size: 13px; color: var(--muted);
    cursor: pointer; padding: 4px 10px; border-radius: 8px;
  }
  #page-indicator:active { background: var(--chrome-border); }
  #page-jump-input {
    font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--chrome-border); border-radius: 8px;
    width: 70px; text-align: center; padding: 4px 6px;
    font-family: inherit; display: none;
  }

  #tabbar, #trainer-tabbar {
    display: flex;
    flex: 0 0 auto;
    background: var(--chrome-bg);
    border-top: 1px solid var(--chrome-border);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .tab-btn {
    flex: 1 1 0;
    background: none; border: none;
    color: var(--muted);
    font-size: 13px;
    padding: 10px 4px;
    cursor: pointer;
  }
  .tab-btn.active { color: var(--ink); font-weight: 600; }
  /* #tabbar - только иконки (см. HTML), крупнее шрифт под чистый эмодзи;
     #trainer-tabbar остаётся с текстом (там места достаточно, 2 кнопки). */
  /* padding уменьшен против общего .tab-btn (10px 4px) - крупный эмодзи
     (22px против 13px текста) сам по себе выше строкой, без компенсации
     панель выросла бы с ~38px до ~50px высотой и забрала место у текста
     Корана (#page-wrap, flex:1 - любой рост #tabbar сжимает именно его).
     Проверено headless Chrome - с этим padding итоговая высота близка к
     исходной (пользователь 30.08.2026, "не должны терять пространство
     для текста Курана"). */
  #tabbar .tab-btn { font-size: 22px; padding: 6px 4px; }

  #words-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .word-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--chrome-border);
  }
  .word-row .arabic {
    font-family: 'Scheherazade New', serif;
    font-size: 26px;
    direction: rtl;
  }
  .word-row .translation {
    font-size: 14px;
    color: var(--muted);
    text-align: left;
    flex: 0 0 auto;
    max-width: 55%;
  }
  .words-ayah-sep {
    text-align: center;
    color: var(--marker-color);
    font-size: 12px;
    padding: 10px 0 2px;
  }

  /* "Мои слова" (29.08.2026) - тот же паттерн, что и #ayah-text: колонка
     книжной ширины по центру экрана, не растянута во всю ширину широкого
     монитора/планшета (иначе арабский слева и перевод справа разъедутся на
     разные концы экрана - тот же баг, что чинили для #ayah-text 27.08). */
  #mywords-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 8px 16px;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .mywords-row { cursor: pointer; }
  .mywords-row:active { background: var(--accent-soft); }

  /* Тап по слову на странице чтения - всплывающий перевод (28.08.2026),
     --popup-bg/--popup-ink были заведены заранее для этого же, до этого не
     использовались нигде. color-mix даёт полупрозрачность независимо от
     конкретного hex переменной (светлая/тёмная тема - разные значения). */
  #word-popup {
    position: fixed;
    left: 0; top: 0;
    background: color-mix(in srgb, var(--popup-bg) 88%, transparent);
    color: var(--popup-ink);
    padding: 7px 14px;
    border-radius: 10px;
    font-size: 15px;
    max-width: 70vw;
    text-align: center;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity 0.25s ease;
    z-index: 50;
    direction: ltr;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    white-space: nowrap;
  }
  #word-popup.visible { opacity: 1; }

  /* Подтверждение (30.08.2026) - общая модалка "да/отмена", сейчас только
     для 🔁 "повторение", но написана обобщённо на случай будущих
     похожих подтверждений. */
  #confirm-overlay {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.45);
    display: none;
    align-items: center; justify-content: center;
    z-index: 60; padding: 20px;
    direction: ltr;
  }
  #confirm-overlay.visible { display: flex; }
  .confirm-card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: var(--shadow-md);
    padding: 20px;
    max-width: 320px; width: 100%;
    text-align: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .confirm-card p {
    margin: 0 0 16px; font-size: 15px; color: var(--ink); line-height: 1.4;
  }
  .confirm-card .confirm-actions { display: flex; gap: 10px; justify-content: center; }
  .confirm-card button {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 12px; box-shadow: var(--shadow-sm);
    padding: 9px 18px; font-size: 14px; font-weight: 500;
    color: var(--ink); cursor: pointer; font-family: inherit;
  }
  #confirm-yes {
    background: var(--accent); border-color: var(--accent);
    color: var(--accent-ink); font-weight: 600;
  }

  #meaning-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding: 12px 18px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    direction: ltr;
  }
  .meaning-row { padding: 10px 0 16px; }
  .meaning-row .ayah-num {
    display: inline-block;
    color: var(--marker-color);
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .meaning-row .meaning-text {
    font-size: 16px;
    line-height: 1.55;
    color: var(--ink);
  }

  /* Дашборд YassirApp (28.08.2026, редизайн 29.08.2026) - первый экран
     при открытии. Мусхаф и Тренажёр оба переключают вид внутри этой же
     страницы (см. openTrainer/dash-mushaf в скрипте ниже) - карточки
     визуально равноправны, никакая не "главнее" другой. */
  #dashboard {
    display: flex;
    flex-direction: column;
    height: 100%;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 24px;
    background: linear-gradient(180deg, var(--dash-bg-start), var(--dash-bg-end));
  }
  #dashboard h1 {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--ink);
    margin: 0 0 10px;
  }
  /* "Сейчас онлайн" (30.08.2026) - ненавязчивая строка над карточками, не
     бейдж на конкретной карточке (не должна выглядеть как реклама одного
     раздела - решение пользователя). Пустая (не занимает места) до первого
     ответа heartbeat, чтобы не мигать "0" на долю секунды при открытии. */
  #dash-online {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin-top: -8px;
    /* direction: ltr (30.08.2026) - #dashboard наследует dir="rtl" от
       <html> (см. wiki/mushaf_yassirapp.md, "Ловушка: RTL-контейнер
       зеркалит..."), без этого "точка-число-текст" в DOM переставлялись
       бы визуально в "текст-число-точка". Проверено скриншотом. */
    direction: ltr;
  }
  #dash-online:empty { display: none; }
  #dash-online .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2fbf6e; flex: 0 0 auto;
  }
  .dash-card {
    width: 100%;
    max-width: 320px;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    direction: ltr;
    text-align: left;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .dash-card:active { transform: scale(0.97); box-shadow: var(--shadow-sm); }
  .dash-card .icon-badge {

  .trainer-score { font-size: 13px; color: var(--muted); }

  /* Бейдж фидбека - закрашенная пилюля, не просто цветной текст (25.08 ->

  .trainer-feedback {

<body>
<div id="dashboard">
  <h1>YassirApp</h1>

</div>

<div id="confirm-overlay">

</div>
<div id="app" style="display:none">
  <div id="topbar">
    <div class="topbar-left">
      <button id="mushaf-back" class="topbar-back">← Дашборд</button>
      <span class="surah-name" id="surah-name">—</span>
    </div>
    <div class="topbar-right">
      <!-- Отметка "повторение" (30.08.2026) - студент сам подтверждает, что
           перечитал от начала Аль-Бакары до места, где остановился;
           засчитывает дневное задание "r" (то же, что обычная текстовая
           сдача "повторение" в группе, core/handlers.py) и шлёт короткое
           сообщение в группу. Видна только на вкладке "Страница" (см.
           switchTab) - #topbar уже direction:ltr (в отличие от #page-nav),
           поэтому RTL-зеркалирование тут не грозит. -->
      <button id="btn-revision" title="Отметить повторение">🔁</button>
      <span id="ayah-range"></span>
    </div>
  </div>
  <div id="page-nav">
    <!-- Порядок в DOM - "наоборот" от желаемой картинки (30.08.2026):
         #page-nav наследует dir="rtl", flex-контейнер визуально переставляет
         детей в обратном порядке относительно DOM. Middle-тройка (btn-next/
         page-indicator/btn-prev) НЕ трогается - её собственный визуальный
         результат уже верный (см. CSS-комментарий у .page-nav-util). Итог на
         экране слева направо: 🔖 « ‹ стр. N › » - подтверждено пользователем
         и headless-скриншотом. -->
    <button id="btn-go-baqara" class="page-nav-util" title="Начало Аль-Бакара">»</button>
    <button id="btn-next">‹</button>
    <span id="page-indicator">—</span>
    <input id="page-jump-input" type="number" inputmode="numeric">
    <button id="btn-prev">›</button>
    <button id="btn-bookmark-go" class="page-nav-util" title="К закладке">«</button>
    <button id="btn-bookmark-save" class="page-nav-util" title="Сохранить закладку">🔖</button>
  </div>

  <div id="view-page" class="view">
    <div id="page-wrap">
      <div id="ayah-text"></div>
    </div>
  </div>

  <div id="view-words" class="view">
    <div id="words-list"></div>
  </div>

  <!-- Ссылка на "Слова" убрана из низа мусхафа (28.08.2026) - пословный
       перевод теперь через тап по слову прямо на странице чтения (см.
       #word-popup). #view-words и renderWordsList() ниже НЕ удалены -
       вьюха просто больше не достижима из UI, код на будущее. Вместо неё -
       "Смысл": целостный перевод аятов страницы (Кулиев, api.quran.com,
       разрешение правообладателя на постоянное размещение подтверждено
       пользователем лично 28.08.2026). Переход на след./пред. страницу
       перевода и назад на мусхаф - через #page-nav и #tab-page, они уже

  <div id="view-meaning" class="view">

  <!-- "Мои слова" (29.08.2026) - личный список слов, отмеченных двойным

       ходу чтения"). Простой список для чтения (арабский+перевод), клик по
       строке ничего не открывает - решение пользователя, не квиз, не связан
       с движком тренажёра муфрадата. Убрать слово - тем же двойным
       тапом/кликом, но уже здесь, по строке (см. #mywords-list ниже). -->
  <div id="view-mywords" class="view">
    <div id="mywords-list"></div>
  </div>

  <div id="tabbar">
    <!-- Только иконки (30.08.2026, после добавления 4-й вкладки "Тренажёр" -
         с текстом "Мои слова" переносилось на 2 строки на узких экранах,

         подсказка при наведении/для скринридера, подпись остаётся понятной
         без текста (те же эмодзи, что и на карточках дашборда/в шапках). -->
    <button id="tab-page" class="tab-btn" title="Страница">📖</button>
    <button id="tab-meaning" class="tab-btn" title="Смысл">📜</button>
    <button id="tab-mywords" class="tab-btn" title="Мои слова">🔖</button>
    <!-- Прямой переход в Тренажёр без дашборда (30.08.2026, решение
         пользователя) - НЕ switchTab (уводит из #app целиком), поэтому
         .active никогда не проставляется - после клика вкладки всё равно
         не видны (см. openTrainer). -->
    <button id="tab-trainer" class="tab-btn" title="Тренажёр">🌱</button>
  </div>
</div>

<div id="trainer">
  <div id="trainer-topbar">
    <button id="trainer-back">← Дашборд</button>
    <span id="trainer-bookmark">Тренажёр</span>
    <span id="trainer-daily"></span>
  </div>
  <div id="trainer-body"></div>
  <!-- Прямой переход в Мусхаф/Мои слова без дашборда (30.08.2026, решение
       пользователя, симметрично 🌱 в #tabbar мусхафа). -->
  <div id="trainer-tabbar">
    <button id="trainer-tab-mywords" class="tab-btn">🔖 Мои слова</button>
    <button id="trainer-tab-mushaf" class="tab-btn">📗 Мусхаф</button>
  </div>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  // "Сейчас онлайн" (30.08.2026) - heartbeat каждые 20 сек, пока YassirApp
  // открыт (независимо от того, какой экран сейчас - дашборд/мусхаф/
  // тренажёр), бейдж обновляется только на дашборде. setTimeout(..., 0)
  // вместо прямого вызова - apiCall/API_BASE объявлены НИЖЕ по файлу
  // (var, hoisting не помогает с присваиванием), первый вызов должен
  // случиться уже ПОСЛЕ того, как синхронное исполнение скрипта дойдёт до
  // той строчки - setInterval-колбэки и так асинхронны, а вот этот, самый
  // первый, синхронно выполнился бы слишком рано без отложенного старта.
  var HEARTBEAT_INTERVAL_MS = 20000;
  var ONLINE_BADGE_MIN = 3; // меньше - не показываем совсем (решение
  // пользователя 30.08.2026 - 1-2 "онлайн" выглядит бедно, не украшает)
  function sendHeartbeat() {
    apiCall('/heartbeat', { method: 'POST' }).then(function (res) {
      if (res.status === 401) return;
      var el = document.getElementById('dash-online');
      if (res.data && typeof res.data.online === 'number' && res.data.online >= ONLINE_BADGE_MIN) {
        el.innerHTML = '<span class="dot"></span>сейчас в онлайне учатся ' + res.data.online;
      } else {
        el.innerHTML = '';
      }
    });
  }
  setTimeout(sendHeartbeat, 0);
  setInterval(sendHeartbeat, HEARTBEAT_INTERVAL_MS);

  // Дашборд YassirApp (28.08.2026/29.08.2026) - первый экран. "Мусхаф" и
  // "Тренажёр" оба теперь переключают вид ВНУТРИ этого же приложения (до
  // 29.08.2026 Тренажёр уводил обратно в чат с ботом deep-link'ом - решение
  // пользователя "ты странный мы же ее ложим вместе с мусхафом в один
  // апп" - движок тренажёра (core/mufradat.py) был уже транспорт-независим,
  // core/mufradat_api.py просто открывает его по HTTP, core/mufradat_bot.py
  // (чат-версия) не тронут, оба используют один и тот же движок/БД).
  // openMushaf(tab) - общая точка входа в #app, вызывается и с дашборда
  // (tab='page'), и напрямую из Тренажёра (30.08.2026, решение пользователя
  // "удобный переход без дашборда") - оттуда может понадобиться сразу
  // открыть "Мои слова", а не только "Страницу". Прячет #trainer тоже
  // (не только #dashboard) - иначе повторный вызов из Тренажёра оставлял
  // бы его видимым под #app.
  function openMushaf(tab) {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('trainer').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    switchTab(tab || 'page');
    // clampFontToFit() при самом рендере страницы (reveal(), см. выше)
    // считает по нулевой ширине - #app в этот момент ещё display:none
    // (дашборд - первый экран, см. комментарий выше), контейнер без
    // ширины, подгонка молча не срабатывает. Пересчёт здесь - сразу как
    // #app стал видимым (28.08.2026, тот самый баг с обрезкой текста на
    // телефоне: у уже открывавших мусхаф раньше страница подгружается
    // ИЗ localStorage ещё до клика по карточке).
    document.fonts.ready.then(clampFontToFit);
  }
  // Дашборд YassirApp (28.08.2026/29.08.2026) - первый экран. "Мусхаф" и
  // "Тренажёр" оба теперь переключают вид ВНУТРИ этого же приложения (до
  // 29.08.2026 Тренажёр уводил обратно в чат с ботом deep-link'ом - решение
  // пользователя "ты странный мы же ее ложим вместе с мусхафом в один
  // апп" - движок тренажёра (core/mufradat.py) был уже транспорт-независим,
  // core/mufradat_api.py просто открывает его по HTTP, core/mufradat_bot.py
  // (чат-версия) не тронут, оба используют один и тот же движок/БД).
  // Вход с дашборда - всегда вкладка "Страница" (30.08.2026, решение
  // пользователя), даже если в прошлый раз ушли со "Смысла"/"Мои слова".
  document.getElementById('dash-mushaf').addEventListener('click', function () { openMushaf('page'); });
  document.getElementById('dash-trainer').addEventListener('click', openTrainer);
  document.getElementById('tab-trainer').addEventListener('click', openTrainer);
  document.getElementById('trainer-tab-mywords').addEventListener('click', function () { openMushaf('mywords'); });
  document.getElementById('trainer-tab-mushaf').addEventListener('click', function () { openMushaf('page'); });
  // role="button" на <div> не даёт Enter/Space нативно, в отличие от <button> -
  // нужен явный keydown (30.08.2026, клавиатурная навигация Telegram Desktop).
  Array.prototype.forEach.call(document.querySelectorAll('.dash-card'), function (card) {
    card.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); card.click(); }
    });
  });
  document.getElementById('mushaf-back').addEventListener('click', function () {
    document.getElementById('app').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
  });

  function escapeAttr(s) {
    return s.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  var FIRST_PAGE = 1, LAST_PAGE = 604;
  var cache = {};

  // Комфортный размер (28px, поднят с 26px решением пользователя
  // 28.08.2026 - "бывает мелко", особенно ощутимо на Pixel 7 и подобных
  // средних по ширине телефонах даже там, где подгонка ниже вообще не
  // ужимает шрифт). Раньше был 26px - решение пользователя 27.08.2026, тогда же
  // отказались от ИТЕРАТИВНОГО (бинарный поиск) автоподбора ПОД ВЫСОТУ
  // ("без прокрутки") - у него было два реальных бага: гонка с загрузкой
  // шрифта (подбор считал по чужим метрикам временного системного шрифта,
  // потом Scheherazade New/V4 догружалась и текст вылезал) и нечитаемо
  // мелкий шрифт на плотных страницах (15-16 строк), лишь бы влезла вся
  // страница без скролла. #page-wrap как был со скроллом, так и остался -
  // высоту не трогаем.
  //
  // Здесь другая ось - ШИРИНА (баг найден 28.08.2026, живьём на телефоне):
  // строки мусхафа (QUL/King Fahd Complex) визуально выровнены по правому
  // и левому краю печатной страницы через кашиду, зашитую в сам глиф V4 -
  // на узких экранах (iPhone SE и подобные, ~360px) при 26px самая длинная
  // строка страницы шире контейнера на 80-90px, несколько букв справа
  // срезаются. На экранах шире ~480px (обычные телефоны, планшеты,
  // десктоп) запаса уже хватает - оверфлоу нет.
  //
  // Фикс - ОДНОРАЗОВОЕ измерение (не цикл/бинарный поиск): сброс на базовый
  // размер, реальный scrollWidth/clientWidth уже отрисованных строк, один
  // прямой пересчёт font-size по худшей строке. Вызывается из reveal() -
  // ПОСЛЕ document.fonts.ready (шрифт гарантированно применён к тексту,
  // гонки нет, см. комментарий у reveal ниже); из клика по карточке
  // "Мусхаф" на дашборде (см. dash-mushaf выше - у вернувшегося студента
  // страница уже отрендерена ИЗ localStorage, пока #app был display:none
  // и .clientWidth врал нулём, здесь первый реальный шанс измерить); и на
  // resize/поворот экрана (см. addEventListener('resize') ниже) - нигде
  // не в цикле кадров.
  var MUSHAF_FONT_SIZE = 28;
  var MUSHAF_MIN_FONT_SIZE = 14;

  function clampFontToFit() {
    var el = document.getElementById('ayah-text');
    el.style.fontSize = MUSHAF_FONT_SIZE + 'px';
    var lines = el.querySelectorAll('.mushaf-line');
    if (!lines.length) return;
    var maxRatio = 1;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i];
      if (l.clientWidth > 0) {
        maxRatio = Math.max(maxRatio, l.scrollWidth / l.clientWidth);
      }
    }
    if (maxRatio > 1) {
      var fitted = Math.max(MUSHAF_MIN_FONT_SIZE, Math.floor(MUSHAF_FONT_SIZE / maxRatio));
      el.style.fontSize = fitted + 'px';
    }
  }

  // Шрифт QPC V4 Tajweed - свой файл НА КАЖДУЮ страницу (604 разных
  // файла), значит на каждой навигации грузится заново. Раньше src
  // переписывался прямо в <style> - HTML с class="v4-word" уходил в DOM
  // СИНХРОННО, до того как шрифт реально скачался, браузер красил первый
  // кадр текста запасным шрифтом (тот не понимает PUA-глифы шрифта v4) -
  // видимый "голый текст, потом сворачивается" (реальный баг, пользователь
  // поймал на живой странице 28.08.2026). Фикс - FontFace API: явно ждём
  // .load() ПЕРЕД тем, как вставлять текст в DOM, никакого кадра с неверным
  // шрифтом просто не возникает физически. currentV4Face - чтобы не
  // копить в document.fonts все посещённые страницы разом (604 файла).
  var currentV4Face = null;
  function loadV4Font(url) {
    var face = new FontFace('mushaf-v4', "url('" + url + "')");
    return face.load().then(function (loaded) {
      if (currentV4Face) { try { document.fonts.delete(currentV4Face); } catch (e) {} }
      document.fonts.add(loaded);
      currentV4Face = loaded;
    });
  }

  var currentSurahNameText = '';
  function renderPage(data) {
    currentSurahNameText = data.surah_names.join(', ');
    document.getElementById('surah-name').textContent = currentSurahNameText;
    var firstAyah = data.ayahs[0], lastAyah = data.ayahs[data.ayahs.length - 1];
    document.getElementById('ayah-range').textContent =
      'аят ' + firstAyah.ayah + (lastAyah.ayah !== firstAyah.ayah ? '–' + lastAyah.ayah : '');
    document.getElementById('page-indicator').textContent = 'стр. ' + data.page;

    // Настоящая построчная вёрстка (QUL/King Fahd Complex, 27.08.2026) -
    // каждая строка мусхафа - свой <div>, а не единый абзац с переносом
    // по ширине браузера. surah_name_ar - реальное арабское имя суры
    // (quran_transcript), не наша русская транслитерация из SURAH_NAMES.
    var html = '';
    (data.lines || []).forEach(function (line) {
      if (line.type === 'header') {
        html += '<div class="surah-banner">سُورَةُ ' + line.surah_name_ar + '</div>';
      } else if (line.type === 'bismillah') {
        if (line.html) html += '<div class="bismillah">' + line.html + '</div>';
      } else if (line.type === 'text') {
        html += '<div class="mushaf-line">';
        line.tokens.forEach(function (t) {
          if (t.type === 'word') {
            // data-surah/data-ayah/data-pos/data-arabic - только вместе с
            // data-tr (29.08.2026, для "Мои слова" - двойной тап нужно
            // от чего-то отличать от одиночного, а слово без перевода и
            // так не кликабельно, см. showWordPopup/addToMyWords ниже).
            var tr = t.translation ? ' data-tr="' + escapeAttr(t.translation) + '"' +
              ' data-surah="' + t.surah + '" data-ayah="' + t.ayah + '" data-pos="' + t.position + '"' +
              ' data-arabic="' + escapeAttr(t.html) + '"' : '';
            if (t.code_v4) {
              html += '<span class="v4-word"' + tr + '>' + t.code_v4 + '</span>';
            } else {
              html += '<span' + tr + '>' + t.html + '</span>';
            }
          } else if (t.type === 'marker') {
            html += '<span class="marker">' + t.html + '</span>';
          } else if (t.type === 'ayah_end') {
            if (t.code_v4) {
              html += '<span class="v4-word">' + t.code_v4 + '</span>';
            } else {
              html += '<span class="ayah-end">﴾' + t.html + '﴿</span>';
            }
          }
        });
        html += '</div>';
      }
    });
    var reveal = function () {
      document.getElementById('ayah-text').innerHTML = html;
      // document.fonts.ready, не сразу clampFontToFit() - у loadV4Font()
      // .load() резолвится, как только байты шрифта скачаны и распаршены,
      // но браузеру ещё нужно применить его к УЖЕ ВСТАВЛЕННОМУ тексту
      // (шейпинг/layout) - если мерить scrollWidth/clientWidth синхронно
      // сразу после innerHTML, в редких случаях попадаешь в кадр с ещё не
      // до конца применённым шрифтом и подгонка считает по чужим метрикам
      // (тот самый класс бага 27.08, только с других обеих сторон гонки -
      // теперь про сам подбор, а не про домешивание текста). fonts.ready
      // ждёт именно готовности к раскладке, а не просто загрузки байтов.
      document.fonts.ready.then(clampFontToFit);
    };
    // Если шрифт не загрузился (сеть) - всё равно показываем текст, а не
    // висим бесконечно; PUA-глифы без своего шрифта покажутся "тофу"-
    // прямоугольниками в запасном шрифте - хуже, чем пустая страница, но
    // студент хотя бы поймёт, что что-то не так, а не решит, что бот завис.
    loadV4Font(data.font_url).then(reveal, reveal);

    document.getElementById('btn-prev').disabled = data.page >= LAST_PAGE;
    document.getElementById('btn-next').disabled = data.page <= FIRST_PAGE;

    renderWordsList(data);
    renderMeaning(data);
  }

  // Тап по слову на странице чтения - быстрый перевод во всплывающей
  // подсказке (28.08.2026, добавлено ПОВЕРХ вкладки "Слова" ниже, не
  // вместо неё - вкладка остаётся для вдумчивого разбора, подсказка - для
  // мгновенного взгляда без переключения экрана). Один слушатель на
  // контейнер (делегирование) - работает и после innerHTML-замены при
  // смене страницы, не нужно перевешивать на каждое слово заново.
  var wordPopup = document.getElementById('word-popup');
  var popupHideTimer = null;
  function showPopupMessage(el, text) {
    wordPopup.textContent = text;
    var rect = el.getBoundingClientRect();
    wordPopup.style.left = (rect.left + rect.width / 2) + 'px';
    wordPopup.style.top = (rect.top - 8) + 'px';
    wordPopup.classList.add('visible');
    clearTimeout(popupHideTimer);
    popupHideTimer = setTimeout(function () {
      wordPopup.classList.remove('visible');
    }, 1800);
  }
  function showWordPopup(el) {
    var text = el.getAttribute('data-tr');
    if (text) showPopupMessage(el, text);
  }

  // Общая модалка "да/отмена" (30.08.2026, сейчас только для 🔁
  // "повторение") - showConfirm(текст, колбэк) показывает вопрос, колбэк
  // вызывается только по "Да", по "Отмена"/фону - ничего не происходит.
  var confirmOverlay = document.getElementById('confirm-overlay');
  var confirmOnYes = null;
  function showConfirm(text, onYes) {
    document.getElementById('confirm-text').textContent = text;
    confirmOnYes = onYes;
    confirmOverlay.classList.add('visible');
  }
  function hideConfirm() {
    confirmOverlay.classList.remove('visible');
    confirmOnYes = null;
  }
  document.getElementById('confirm-cancel').addEventListener('click', hideConfirm);
  confirmOverlay.addEventListener('click', function (e) {
    if (e.target === confirmOverlay) hideConfirm();
  });
  document.getElementById('confirm-yes').addEventListener('click', function () {
    var cb = confirmOnYes;
    hideConfirm();
    if (cb) cb();
  });

  // "Мои слова" (29.08.2026) - двойной тап/клик по слову на странице
  // чтения добавляет его в личный список (см. #tab-mywords ниже), не
  // открывает подсказку перевода. Один клик и так уже даёт перевод во
  // всплывашке - нужно различать один тап от двух, поэтому одиночный клик
  // задерживается на короткое окно: не пришёл второй клик по ТОМУ ЖЕ
  // слову за это время - показываем подсказку как раньше; пришёл - это
  // двойной тап, подсказку глушим и добавляем слово в список.
  var DOUBLE_TAP_WINDOW_MS = 300;
  var wordTapTimer = null, wordTapTarget = null;
  function addToMyWords(el) {
    var surah = el.getAttribute('data-surah');
    if (!surah) return;
    apiCall('/words/add', { method: 'POST', body: {
      surah: parseInt(surah, 10),
      ayah: parseInt(el.getAttribute('data-ayah'), 10),
      position: parseInt(el.getAttribute('data-pos'), 10),
      arabic: el.getAttribute('data-arabic') || '',
      translation: el.getAttribute('data-tr') || '',
    } }).then(function (res) {
      if (res.status !== 401) showPopupMessage(el, '✅ В «Мои слова»');
    });
  }
  document.getElementById('ayah-text').addEventListener('click', function (e) {
    if (justSwiped) { justSwiped = false; return; }
    var el = e.target.closest('[data-tr]');
    if (!el) return;
    if (wordTapTimer && wordTapTarget === el) {
      clearTimeout(wordTapTimer);
      wordTapTimer = null; wordTapTarget = null;
      addToMyWords(el);
      return;
    }
    wordTapTarget = el;
    wordTapTimer = setTimeout(function () {
      showWordPopup(el);
      wordTapTimer = null; wordTapTarget = null;
    }, DOUBLE_TAP_WINDOW_MS);
  });

  function renderWordsList(data) {
    // "Слова" - отдельный чистый список слово+перевод для этой же
    // страницы (решение пользователя 27.08.2026, "нравится их вариант" -
    // ссылаясь на quran-stroka.vercel.app) - остаётся для вдумчивого
    // разбора аята целиком, подсказка по тапу выше - для быстрого взгляда
    // прямо на странице чтения (добавлена 28.08.2026, обе формы теперь
    // сосуществуют, не заменяют друг друга).
    var html = '';
    data.ayahs.forEach(function (a) {
      html += '<div class="words-ayah-sep">аят ' + a.ayah + '</div>';
      a.tokens.forEach(function (t) {
        if (t.type !== 'word') return;
        html += '<div class="word-row">' +
          '<span class="arabic">' + t.html + '</span>' +
          '<span class="translation">' + (t.translation || '') + '</span>' +
          '</div>';
      });
    });
    document.getElementById('words-list').innerHTML = html;
  }

  function renderMeaning(data) {
    // "Смысл" - целостный перевод аятов страницы (Кулиев, 28.08.2026),
    // не пословный список (тот - #word-popup на самой странице чтения).
    // meaning может отсутствовать (страница ещё не догнана скриптом
    // scripts/add_ayah_meaning.py) - тогда просто не показываем блок для
    // этого аята, не выдумываем текст.
    var html = '';
    data.ayahs.forEach(function (a) {
      if (!a.meaning) return;
      html += '<div class="meaning-row">' +
        '<span class="ayah-num">аят ' + a.ayah + '</span>' +
        '<div class="meaning-text">' + a.meaning + '</div>' +
        '</div>';
    });
    document.getElementById('meaning-list').innerHTML = html ||
      '<div class="meaning-row"><span class="ayah-num">перевод смысла для этой страницы ещё не загружен</span></div>';
  }

  function switchTab(name) {
    // tab-words/#view-words больше не в UI (см. комментарий у #tabbar
    // выше), но код оставлен на будущее.
    document.getElementById('view-page').classList.toggle('active', name === 'page');
    document.getElementById('view-words').classList.toggle('active', name === 'words');
    document.getElementById('view-meaning').classList.toggle('active', name === 'meaning');
    document.getElementById('view-mywords').classList.toggle('active', name === 'mywords');
    document.getElementById('tab-page').classList.toggle('active', name === 'page');
    document.getElementById('tab-meaning').classList.toggle('active', name === 'meaning');
    document.getElementById('tab-mywords').classList.toggle('active', name === 'mywords');
    // "Мои слова" - список ПО ВСЕЙ книге, не привязан к текущей странице
    // (29.08.2026, поймано пользователем живьём - "стр. 4" в шапке над
    // списком выглядела так, будто список тоже про эту страницу). Номер
    // страницы/навигация ‹›/аят-диапазон - убираем, они относятся только
    // к "Странице"/"Смыслу". Имя суры в шапке слева раньше оставляли как
    // ambient-контекст, но с телефона было неочевидно, что это за вкладка
    // (пользователь, 29.08.2026) - теперь явный заголовок "Мои слова",
    // имя суры возвращается при уходе с вкладки.
    document.getElementById('page-nav').style.display = name === 'mywords' ? 'none' : 'flex';
    document.getElementById('ayah-range').style.display = name === 'mywords' ? 'none' : '';
    document.getElementById('surah-name').textContent =
      name === 'mywords' ? '🔖 Мои слова' : currentSurahNameText;
    // 🔁 "повторение" (30.08.2026) - только на "Странице" (решение
    // пользователя), не на "Смысле"/"Мои слова".
    document.getElementById('btn-revision').style.display = name === 'page' ? '' : 'none';
    if (name === 'page') clampFontToFit();
    if (name === 'mywords') loadMyWords();
  }
  document.getElementById('tab-page').addEventListener('click', function () { switchTab('page'); });
  document.getElementById('tab-meaning').addEventListener('click', function () { switchTab('meaning'); });
  document.getElementById('tab-mywords').addEventListener('click', function () { switchTab('mywords'); });
  switchTab('page');

  // "Мои слова" - список (29.08.2026, см. модульный комментарий у
  // #view-mywords). Свой делегированный обработчик двойного тапа/клика -
  // тот же таймер-паттерн, что у слова на странице чтения выше, но здесь
  // одиночный клик НИЧЕГО не делает (простой список для чтения, решение
  // пользователя - строка не открывает тренажёр), только двойной убирает
  // слово из списка.
  var mywordsTapTimer = null, mywordsTapTarget = null;
  function renderMyWords(words) {
    var html;
    if (!words.length) {
      html = '<div class="trainer-msg">Пока пусто. Дважды нажми на слово во время чтения — оно попадёт сюда.</div>';
    } else {
      html = words.map(function (w) {
        return '<div class="word-row mywords-row" data-surah="' + w.surah + '" data-ayah="' + w.ayah +
          '" data-pos="' + w.position + '"><span class="arabic">' + w.arabic +
          '</span><span class="translation">' + w.translation + '</span></div>';
      }).join('');
    }
    document.getElementById('mywords-list').innerHTML = html;
  }
  function loadMyWords() {
    document.getElementById('mywords-list').innerHTML = '<div class="trainer-msg">Загрузка…</div>';
    apiCall('/words').then(function (res) {
      if (res.status === 401) {
        document.getElementById('mywords-list').innerHTML =
          '<div class="trainer-msg">Сессия Telegram истекла 🤲 Перезайди в приложение.</div>';
        return;
      }
      renderMyWords(res.data.words);
    });
  }
  function removeFromMyWords(row) {
    apiCall('/words/remove', { method: 'POST', body: {
      surah: parseInt(row.getAttribute('data-surah'), 10),
      ayah: parseInt(row.getAttribute('data-ayah'), 10),
      position: parseInt(row.getAttribute('data-pos'), 10),
    } }).then(function (res) {
      if (res.status !== 401) renderMyWords(res.data.words);
    });
  }
  document.getElementById('mywords-list').addEventListener('click', function (e) {
    var row = e.target.closest('.mywords-row');
    if (!row) return;
    if (mywordsTapTimer && mywordsTapTarget === row) {
      clearTimeout(mywordsTapTimer);
      mywordsTapTimer = null; mywordsTapTarget = null;
      removeFromMyWords(row);
      return;
    }
    mywordsTapTarget = row;
    mywordsTapTimer = setTimeout(function () {
      mywordsTapTimer = null; mywordsTapTarget = null;
    }, DOUBLE_TAP_WINDOW_MS);
  });

  var currentPage = FIRST_PAGE;

  function loadPage(n) {
    if (n < FIRST_PAGE || n > LAST_PAGE) return;
    currentPage = n;
    if (cache[n]) {
      renderPage(cache[n]);
      try { localStorage.setItem('yassir_mushaf_page', String(n)); } catch (e) {}
      return;
    }
    fetch('page' + n + '.json')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        cache[n] = data;
        renderPage(data);
        try { localStorage.setItem('yassir_mushaf_page', String(n)); } catch (e) {}
      });
  }

  document.getElementById('btn-prev').addEventListener('click', function () {
    loadPage(currentPage + 1);
  });
  document.getElementById('btn-next').addEventListener('click', function () {
    loadPage(currentPage - 1);
  });

  // Начало суры Аль-Бакара - стр. 2 (проверено 17.08.2026, см. модульный
  // docstring core/quran_pages.py: "стр. 2 начинает Аль-Бакара с аята 1").
  var BAQARA_START_PAGE = 2;
  document.getElementById('btn-go-baqara').addEventListener('click', function () {
    loadPage(BAQARA_START_PAGE);
  });

  // Закладка страницы чтения (30.08.2026) - 🔖 сохраняет ТЕКУЩУЮ страницу
  // на сервере (по Telegram ID, core/mushaf_words.py), "«" переносит на
  // сохранённую. Не то же самое, что закладка тренажёра (mufradat_page) -
  // отдельная точка возврата, которую студент выставляет сам.
  document.getElementById('btn-bookmark-save').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    apiCall('/bookmark', { method: 'POST', body: { page: currentPage } }).then(function (res) {
      if (res.status !== 401) showPopupMessage(btn, '🔖 Закладка: стр. ' + currentPage);
    });
  });
  document.getElementById('btn-bookmark-go').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    apiCall('/bookmark').then(function (res) {
      if (res.status === 401) return;
      if (res.data && res.data.page) {
        loadPage(res.data.page);
      } else {
        showPopupMessage(btn, 'Закладка ещё не сохранена');
      }
    });
  });

  // Отметка "повторение" (30.08.2026) - решение пользователя: подтверждение
  // ПЕРЕД зачётом (студент мог случайно задеть кнопку), засчитывает
  // дневное задание "r" и шлёт сообщение в группу (core/mufradat_bot.py:
  // credit_revision_task) только после явного "Да".
  document.getElementById('btn-revision').addEventListener('click', function (e) {
    var btn = e.currentTarget;
    showConfirm('Вы сделали повторение с начала суры Аль-Бакара?', function () {
      apiCall('/revision', { method: 'POST' }).then(function (res) {
        if (res.status === 401) return;
        showPopupMessage(btn, res.data && res.data.credited ?
          '✅ Повторение засчитано' : 'Уже засчитано сегодня');
      });
    });
  });

  // Свайп по странице (28.08.2026, направление развёрнуто 30.08.2026 по
  // просьбе пользователя - "интуитивно понятнее наоборот"): палец влево
  // (dx < 0) - назад по мусхафу (currentPage - 1), палец вправо - вперёд
  // (currentPage + 1). #page-wrap уже скроллится вертикально
  // (плотные страницы, 15-16 строк) - жест засчитывается только когда
  // горизонтальная составляющая явно больше вертикальной, иначе обычный
  // вертикальный скролл принимался бы за свайп. justSwiped - клик на
  // ayah-text (попап перевода слова, см. выше) на тачскрине приходит ПОСЛЕ
  // touchend от того же жеста - без флага смахивание страницы попутно
  // открывало бы всплывающую подсказку слова, на котором палец оторвался.
  var pageWrap = document.getElementById('page-wrap');
  var touchStartX = 0, touchStartY = 0, justSwiped = false;
  pageWrap.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
  }, { passive: true });
  pageWrap.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      justSwiped = true;
      loadPage(dx < 0 ? currentPage - 1 : currentPage + 1);
    }
  }, { passive: true });

  // Тап по номеру страницы - прямой переход (220 страниц, недостаточно
  // одних ◀▶ - решение пользователя 27.08.2026, после расширения с 9 до
  // всего диапазона сур 2-10).
  var pageIndicator = document.getElementById('page-indicator');
  var pageJumpInput = document.getElementById('page-jump-input');
  pageIndicator.addEventListener('click', function () {
    pageJumpInput.value = currentPage;
    pageIndicator.style.display = 'none';
    pageJumpInput.style.display = 'inline-block';
    pageJumpInput.focus();
    pageJumpInput.select();
  });
  function commitJump() {
    var n = parseInt(pageJumpInput.value, 10);
    pageJumpInput.style.display = 'none';
    pageIndicator.style.display = 'inline-block';
    if (n >= FIRST_PAGE && n <= LAST_PAGE) loadPage(n);
  }
  pageJumpInput.addEventListener('blur', commitJump);
  pageJumpInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') pageJumpInput.blur();
  });

  window.addEventListener('resize', function () {
    var keys = Object.keys(cache);
    if (keys.length) clampFontToFit();
  });

  var startPage = FIRST_PAGE;
  try {
    var saved = parseInt(localStorage.getItem('yassir_mushaf_page'), 10);
    if (saved >= FIRST_PAGE && saved <= LAST_PAGE) startPage = saved;
  } catch (e) {}
  loadPage(startPage);

  // ── Тренажёр муфрадата в вебе (29.08.2026) ────────────────────────────
  // API - в ТОМ ЖЕ процессе бота (core/mufradat_api.py), свой порт на
  // мужского/женского бота (два процесса на сервере, см. config.py:
  // MUFRADAT_API_PORT) - nginx разводит по префиксу пути /api/muf/<bot>/,
  // поэтому фронтенду нужно знать профиль (?bot=male|female в ссылке,
  // подставляется ботом - core/handlers.py:/mushaf,/yassirapp).
  var BOT_PROFILE = (new URLSearchParams(window.location.search)).get('bot') || 'male';
  var API_BASE = '/api/muf/' + BOT_PROFILE;

  function apiCall(path, opts) {
    opts = opts || {};
    var headers = { 'X-Telegram-Init-Data': (tg && tg.initData) || '' };
    var init = { method: opts.method || 'GET', headers: headers };
    if (opts.body) {
      headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    return fetch(API_BASE + path, init).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; });
    });
  }

  // Проверка 401 в одном месте - initData может протухнуть (сутки, см.
  // core/mufradat_api.py:_INIT_DATA_MAX_AGE) прямо посреди открытого
  // тренажёра, каждый вызов эндпоинта должен на это отреагировать одинаково.
  function withAuthCheck(promise, cb) {
    promise.then(function (res) {
      if (res.status === 401) {
        document.getElementById('trainer-body').innerHTML =
          '<div class="trainer-msg">Сессия Telegram истекла 🤲 Перезайди в приложение.</div>';
        return;
      }
      cb(res.data);
    });
  }

  var trainerState = null;

  function openTrainer() {
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('app').style.display = 'none';
    document.getElementById('trainer').style.display = 'flex';
    document.getElementById('trainer-body').innerHTML = '<div class="trainer-msg">Загрузка…</div>';
    withAuthCheck(apiCall('/state'), function (data) { trainerState = data; renderTrainer(); });
  }

  document.getElementById('trainer-back').addEventListener('click', function () {
    document.getElementById('trainer').style.display = 'none';
    document.getElementById('dashboard').style.display = 'flex';
  });

  function renderFeedbackBanner(feedback) {
    if (!feedback) return '';
    var cls = feedback.correct ? 'ok' : 'no';
    var text = feedback.correct ? '✅ Верно!' : ('❌ Не то, правильно: ' + feedback.target);
    var html = '<div class="trainer-feedback ' + cls + '">' + text + '</div>';
    if (feedback.remaining_for_task > 0) {
      html += '<div class="trainer-hint">📝 Ещё ' + feedback.remaining_for_task +
        ' разных слов сегодня — и дневное задание «Слова» будет засчитано</div>';
    }
    return html;
  }

  function renderOverallScore(s) {
    if (!s) return '';
    var pct = Math.max(0, Math.min(100, s.score10 * 10));
    return '<div class="trainer-score">📊 Общий вес: ' + s.score10.toFixed(2) + '/10 (закреплено ' +
      s.mastered + ' из ' + s.total + ' слов)</div>' +
      '<div class="trainer-score-bar"><div class="trainer-score-bar-fill" style="width:' + pct + '%"></div></div>';
  }

  function renderDailyBadge(d) {
    // Постоянный счётчик в шапке, не только в фидбеке после ответа - см.
    // комментарий у #trainer-daily в CSS. daily_target с бэкенда
    // (DAILY_WORDS_FOR_TASK_CREDIT), не захардкожен во фронтенде - единый
    // источник истины, значение меняли уже дважды (20 → 15 → 20 → 40).
    var el = document.getElementById('trainer-daily');
    if (!d || d.daily_target == null) { el.textContent = ''; el.classList.remove('done'); return; }
    var done = d.daily_count >= d.daily_target;
    el.textContent = d.daily_count + '/' + d.daily_target + ' сегодня';
    el.classList.toggle('done', done);
  }

  function renderTrainer() {
    var d = trainerState;
    var body = document.getElementById('trainer-body');
    renderDailyBadge(d);
    if (!d) { body.innerHTML = ''; return; }

    if (d.needs_page) {
      body.innerHTML =
        '<div class="trainer-msg">📖 Какая страница мусхафа? (стр. ' + d.first_page + '–' + d.last_page + ')</div>' +
        '<div class="trainer-page-input">' +
        '<input id="tp-input" type="number" inputmode="numeric" min="' + d.first_page + '" max="' + d.last_page + '">' +
        '<button id="tp-submit">Начать</button></div>';
      document.getElementById('tp-submit').addEventListener('click', function () {
        var n = parseInt(document.getElementById('tp-input').value, 10);
        if (!n) return;
        withAuthCheck(apiCall('/page', { method: 'POST', body: { page: n } }), function (data) {
          trainerState = data; renderTrainer();
        });
      });
      return;
    }

    if (d.empty) {
      body.innerHTML = renderFeedbackBanner(d.feedback) +
        '<div class="trainer-msg">Слова на твоей закладке пока закончились 🤲 Сдвинь страницу дальше.</div>' +
        renderOverallScore(d.overall_score) +
        '<div class="trainer-pagebar"><button id="tr-inc">➕</button></div>';
      document.getElementById('tr-inc').addEventListener('click', function () { stepPage(1); });
      return;
    }

    var html = renderFeedbackBanner(d.feedback);
    html += '<div class="trainer-info">📖 Твоя страница: ' + d.bookmark_page +
      ' (слово со стр. ' + d.word_page + ')</div>';
    html += '<div class="trainer-word-card"><div class="trainer-word">' + d.arabic + '</div></div>';
    html += '<div class="trainer-session">✅ Верно за сеанс: ' + d.session_correct + '</div>';
    html += renderOverallScore(d.overall_score);
    html += '<div class="trainer-options">';
    d.options.forEach(function (opt, i) {
      html += '<button class="trainer-opt" data-slot="' + i + '">' + opt + '</button>';
    });
    html += '</div>';
    html += '<div class="trainer-pagebar"><button id="tr-dec">➖</button><button id="tr-inc">➕</button></div>';
    html += '<div class="trainer-actions"><button id="tr-end">✅ Закончить</button><button id="tr-top">🏆 Рейтинг</button></div>';
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll('.trainer-opt'), function (btn) {
      btn.addEventListener('click', function () {
        pickAnswer(d.word_id, parseInt(btn.getAttribute('data-slot'), 10));
      });
    });
    document.getElementById('tr-dec').addEventListener('click', function () { stepPage(-1); });
    document.getElementById('tr-inc').addEventListener('click', function () { stepPage(1); });
    document.getElementById('tr-end').addEventListener('click', endSession);
    document.getElementById('tr-top').addEventListener('click', showLeaderboard);
  }

  function pickAnswer(wordId, slot) {
    withAuthCheck(apiCall('/answer', { method: 'POST', body: { word_id: wordId, slot: slot } }), function (data) {
      trainerState = data; renderTrainer();
    });
  }

  function stepPage(delta) {
    withAuthCheck(apiCall('/page', { method: 'POST', body: { delta: delta } }), function (data) {
      trainerState = data; renderTrainer();
    });
  }

  function endSession() {
    withAuthCheck(apiCall('/end', { method: 'POST' }), function (d) {
      var html = '<div class="trainer-msg">Сессия завершена 🤲</div>';
      html += renderOverallScore(d.overall_score);
      if (typeof d.delta === 'number') {
        if (d.delta > 0) html += '<div class="trainer-info">📈 Вырос за сеанс на +' + d.delta.toFixed(2) + '</div>';
        else if (d.delta < 0) html += '<div class="trainer-info">📉 Снизился за сеанс на ' + d.delta.toFixed(2) + '</div>';
        else html += '<div class="trainer-info">Вес за сеанс не изменился — попробуй ещё раз, каждый верный ответ его двигает 🤲</div>';
      }
      if (d.rank) {
        html += '<div class="trainer-info">🏆 Место в ' + d.rank.division + ': ' + d.rank.place + ' из ' + d.rank.total + '</div>';
      }
      html += '<div class="trainer-actions"><button id="tr-restart">🔁 Новая карточка</button>' +
        '<button id="tr-dashboard">🏠 Дашборд</button></div>';
      document.getElementById('trainer-body').innerHTML = html;
      document.getElementById('tr-restart').addEventListener('click', openTrainer);
      document.getElementById('tr-dashboard').addEventListener('click', function () {
        document.getElementById('trainer').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
      });
    });
  }

  function showLeaderboard() {
    withAuthCheck(apiCall('/leaderboard'), function (d) {
      var html = '<div class="trainer-msg">🏆 Топ по муфрадату</div>';
      if (!d.in_group) {
        html += d.personal
          ? '<div class="trainer-info">Место среди всех тренирующихся: ' + d.personal.rank + ' из ' + d.total + '</div>'
          : '<div class="trainer-info">Пока никто не тренировал муфрадат достаточно, чтобы попасть в рейтинг 🤲</div>';
      } else {
        d.divisions.forEach(function (div) {
          if (!div.entries.length) return;
          html += '<div class="trainer-division">' + div.label + '</div>';
          div.entries.slice(0, 7).forEach(function (e, i) {
            html += '<div class="trainer-lb-row' + (e.you ? ' you' : '') + '">' +
              (i + 1) + '. ' + e.name + ' (' + e.group + ') — ' +
              e.accuracy.toFixed(0) + '% (' + e.correct + '/' + e.n + '), стр. ' + e.page + '</div>';
          });
        });
      }
      html += '<div class="trainer-actions"><button id="tr-back-q">⬅️ Назад</button></div>';
      document.getElementById('trainer-body').innerHTML = html;
      document.getElementById('tr-back-q').addEventListener('click', renderTrainer);
    });
  }
})();
</script>
</body>
</html>
